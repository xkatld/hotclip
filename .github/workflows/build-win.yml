name: Build Windows x64

# 手动触发 或 推送 v* tag 时自动构建 Windows 64-bit 安装包
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build bundles
        run: pnpm build

      - name: Package Windows x64 installer
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        shell: bash
        run: ls -lh dist/*.exe dist/*.zip dist/*.blockmap dist/latest.yml 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: hotclip-win-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # 如果是 tag 推送，自动创建 GitHub Release 并上传产物
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"

          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match package.json version v$version"
            exit 1
          fi

          # 创建 release（如果不存在）
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "HotClip $tag (Windows x64)" \
              --generate-notes
          fi

          # 上传产物
          gh release upload "$tag" \
            dist/*.exe dist/*.zip dist/*.blockmap dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --clobber
